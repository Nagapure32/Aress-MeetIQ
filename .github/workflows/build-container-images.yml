name: Build Container Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-container-images.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Azure credentials secret
        shell: bash
        env:
          AZURE_CREDENTIALS_JSON: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "${AZURE_CREDENTIALS_JSON}" ]; then
            echo "::error::AZURE_CREDENTIALS is empty or unavailable. Add it as a repository secret, or attach the GitHub environment that contains it to this job."
            exit 1
          fi
          if ! echo "${AZURE_CREDENTIALS_JSON}" | jq -e . >/dev/null; then
            echo "::error::AZURE_CREDENTIALS is not valid JSON. Paste one JSON object into the secret value."
            exit 1
          fi
          for key in clientId clientSecret subscriptionId tenantId; do
            if [ "$(echo "${AZURE_CREDENTIALS_JSON}" | jq -r --arg key "$key" '.[$key] // empty')" = "" ]; then
              echo "::error::AZURE_CREDENTIALS is missing ${key}."
              exit 1
            fi
          done
          echo "AZURE_CREDENTIALS secret is present and has the required JSON keys."

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/meetiq-backend:${{ github.sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/meetiq-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/meetiq-frontend:${{ github.sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/meetiq-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_NAME=${{ vars.NEXT_PUBLIC_APP_NAME }}
