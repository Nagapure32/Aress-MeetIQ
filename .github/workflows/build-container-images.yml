name: Build Container Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-container-images.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Azure credentials secrets
        shell: bash
        env:
          CLIENTID: ${{ secrets.CLIENTID }}
          CLIENTSECRET: ${{ secrets.CLIENTSECRET }}
          SUBSCRIPTIONID: ${{ secrets.SUBSCRIPTIONID }}
          TENANTID: ${{ secrets.TENANTID }}
        run: |
          set -euo pipefail
          missing=()
          for key in CLIENTID CLIENTSECRET SUBSCRIPTIONID TENANTID; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}."
            exit 1
          fi
          echo "Azure credential repository secrets are present."

      - name: Azure login
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.CLIENTID }}
          AZURE_CLIENT_SECRET: ${{ secrets.CLIENTSECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTIONID }}
          AZURE_TENANT_ID: ${{ secrets.TENANTID }}
        run: |
          az login \
            --service-principal \
            --username "${AZURE_CLIENT_ID}" \
            --password "${AZURE_CLIENT_SECRET}" \
            --tenant "${AZURE_TENANT_ID}" \
            --output none
          az account set --subscription "${AZURE_SUBSCRIPTION_ID}"

      - name: Login to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/meetiq-backend:${{ github.sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/meetiq-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/meetiq-frontend:${{ github.sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/meetiq-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_NAME=${{ vars.NEXT_PUBLIC_APP_NAME }}
